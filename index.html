<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Safe - Live Tracking</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #dc2626; color: #fff;
    padding: 14px 16px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #header h1 { font-size: 16px; font-weight: 700; }
  #header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  #status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: #1e293b; color: #94a3b8;
    padding: 10px 16px; text-align: center; font-size: 13px;
  }
  #status-bar.inactive { background: #7f1d1d; color: #fca5a5; }
  #map { position: absolute; top: 56px; left: 0; right: 0; bottom: 40px; }
  #loading {
    position: fixed; inset: 0; z-index: 2000;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 18px;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #334155;
    border-top-color: #dc2626; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-screen {
    position: fixed; inset: 0; z-index: 2000;
    background: #0f172a; color: #e2e8f0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #error-screen h2 { color: #dc2626; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span>Loading tracking data...</span></div>
<div id="error-screen"><h2>Unable to Load</h2><p id="error-msg"></p></div>
<div id="header"><h1 id="alert-title">SAFE ALERT</h1><p id="alert-time"></p></div>
<div id="map"></div>
<div id="status-bar"><span id="status-text">Connecting...</span></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
// Get token from URL
var params = new URLSearchParams(window.location.search);
var shareToken = params.get('token');

if (!shareToken) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
  document.getElementById('error-msg').textContent = 'No tracking token provided.';
} else {
  startTracking(shareToken);
}

function startTracking(token) {
  var SUPA_URL = 'https://vzilxgzcuqdutyayycgy.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6aWx4Z3pjdXFkdXR5YXl5Y2d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTIzNjQsImV4cCI6MjA5MDI4ODM2NH0.YOH2WhNpY9m0-Au36UU_89tPJhN7wQRNIazBH_KebWY';
  var headers = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY };

  var map, marker, polyline, trail = [], lastUpdate = null, eventId = null;

  // Fetch the SOS event
  fetch(SUPA_URL + '/rest/v1/sos_events?share_token=eq.' + token + '&limit=1', { headers: headers })
    .then(function(r) { return r.json(); })
    .then(function(events) {
      if (!events || events.length === 0) {
        showError('This tracking link is invalid or has expired.');
        return;
      }

      var ev = events[0];
      eventId = ev.id;

      // Update header
      document.getElementById('alert-title').textContent = 'SAFE ALERT: ' + (ev.user_name || 'Someone') + ' may need help';
      var t = new Date(ev.triggered_at);
      document.getElementById('alert-time').textContent = 'Triggered ' + t.toLocaleString();

      // Setup map
      var lat = ev.initial_lat || 51.5;
      var lng = ev.initial_lng || -0.12;

      map = L.map('map').setView([lat, lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      var icon = L.divIcon({
        className: '',
        html: '<div style="width:18px;height:18px;background:#dc2626;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(220,38,38,0.6);"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
      });
      marker = L.marker([lat, lng], { icon: icon }).addTo(map);
      polyline = L.polyline([], { color: '#dc2626', weight: 3, opacity: 0.7 }).addTo(map);

      if (!ev.is_active) {
        document.getElementById('status-bar').className = 'inactive';
        document.getElementById('status-text').textContent = 'Alert is no longer active';
        document.getElementById('header').style.background = '#64748b';
      }

      // Fetch location updates
      return fetch(SUPA_URL + '/rest/v1/location_updates?sos_event_id=eq.' + eventId + '&order=recorded_at.asc', { headers: headers });
    })
    .then(function(r) { if (r) return r.json(); })
    .then(function(locations) {
      if (locations && locations.length > 0) {
        for (var i = 0; i < locations.length; i++) {
          addPoint(locations[i].lat, locations[i].lng, new Date(locations[i].recorded_at));
        }
      }

      // Hide loading
      document.getElementById('loading').style.display = 'none';

      // Poll for new locations every 5 seconds (simpler than realtime)
      setInterval(function() { pollLocations(); }, 5000);
      setInterval(updateTimer, 1000);
    })
    .catch(function(err) {
      console.error(err);
      showError('Failed to load tracking data.');
    });

  function pollLocations() {
    if (!eventId) return;
    var since = lastUpdate ? lastUpdate.toISOString() : '2000-01-01T00:00:00Z';
    fetch(SUPA_URL + '/rest/v1/location_updates?sos_event_id=eq.' + eventId + '&recorded_at=gt.' + since + '&order=recorded_at.asc', { headers: headers })
      .then(function(r) { return r.json(); })
      .then(function(locs) {
        if (locs) {
          for (var i = 0; i < locs.length; i++) {
            addPoint(locs[i].lat, locs[i].lng, new Date(locs[i].recorded_at));
          }
        }
      })
      .catch(function() {});
  }

  function addPoint(lat, lng, time) {
    trail.push([lat, lng]);
    lastUpdate = time;
    if (marker) marker.setLatLng([lat, lng]);
    if (polyline) polyline.setLatLngs(trail);
    if (map) map.panTo([lat, lng]);
  }

  function updateTimer() {
    if (!lastUpdate) return;
    var secs = Math.floor((Date.now() - lastUpdate.getTime()) / 1000);
    var text;
    if (secs < 5) text = 'Last updated: just now';
    else if (secs < 60) text = 'Last updated: ' + secs + 's ago';
    else text = 'Last updated: ' + Math.floor(secs/60) + 'm ' + (secs%60) + 's ago';
    document.getElementById('status-text').textContent = text;
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
  document.getElementById('error-msg').textContent = msg;
}
</script>
</body>
</html>
