<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Safe - Live Tracking</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #dc2626; color: #fff;
    padding: 14px 16px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #header h1 { font-size: 16px; font-weight: 700; }
  #header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  #status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: #1e293b; color: #94a3b8;
    padding: 10px 16px; text-align: center; font-size: 13px;
  }
  #map { position: absolute; top: 56px; left: 0; right: 0; bottom: 40px; }
  #loading {
    position: fixed; inset: 0; z-index: 2000;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 18px;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #334155;
    border-top-color: #dc2626; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #action-buttons {
    position: fixed; bottom: 52px; right: 16px; z-index: 1000;
    display: none; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .action-btn {
    border: none; border-radius: 12px;
    padding: 12px 18px; font-size: 14px; font-weight: 600;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    color: #fff;
  }
  .action-btn:active { opacity: 0.85; }
  .btn-maps { background: #2563eb; }
  .btn-uber { background: #000; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span id="load-text">Loading tracking data...</span></div>
<div id="header"><h1 id="alert-title">SAFE ALERT</h1><p id="alert-time"></p></div>
<div id="map"></div>
<div id="action-buttons">
  <button class="action-btn btn-uber" onclick="openUber()">Send them an Uber</button>
  <button class="action-btn btn-maps" onclick="openInMaps()">Open in Maps</button>
</div>
<div id="status-bar"><span id="status-text">Connecting...</span></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
var SUPA = 'https://vzilxgzcuqdutyayycgy.supabase.co/rest/v1';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6aWx4Z3pjdXFkdXR5YXl5Y2d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTIzNjQsImV4cCI6MjA5MDI4ODM2NH0.YOH2WhNpY9m0-Au36UU_89tPJhN7wQRNIazBH_KebWY';
var HDRS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY };

var token = new URLSearchParams(window.location.search).get('token');
var map, marker, polyline, trail = [], lastUpdate = null, eventId = null;
var currentLat = 0, currentLng = 0;

if (!token) {
  document.getElementById('load-text').textContent = 'Error: No tracking token provided.';
} else {
  load();
}

async function load() {
  try {
    document.getElementById('load-text').textContent = 'Fetching event...';

    var res = await fetch(SUPA + '/sos_events?share_token=eq.' + token + '&limit=1', { headers: HDRS });
    var events = await res.json();

    if (!events || events.length === 0) {
      document.getElementById('load-text').textContent = 'Error: Invalid or expired tracking link.';
      return;
    }

    var ev = events[0];
    eventId = ev.id;

    document.getElementById('alert-title').textContent = 'SAFE ALERT: ' + (ev.user_name || 'Someone') + ' may need help';
    document.getElementById('alert-time').textContent = 'Triggered ' + new Date(ev.triggered_at).toLocaleString();

    document.getElementById('load-text').textContent = 'Loading map...';

    var lat = ev.initial_lat || 51.5;
    var lng = ev.initial_lng || -0.12;
    currentLat = lat;
    currentLng = lng;

    map = L.map('map').setView([lat, lng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);

    var icon = L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;background:#dc2626;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(220,38,38,0.6)"></div>',
      iconSize: [18, 18], iconAnchor: [9, 9]
    });
    marker = L.marker([lat, lng], { icon: icon }).addTo(map);
    polyline = L.polyline([], { color: '#dc2626', weight: 3, opacity: 0.7 }).addTo(map);

    var res2 = await fetch(SUPA + '/location_updates?sos_event_id=eq.' + eventId + '&order=recorded_at.asc', { headers: HDRS });
    var locs = await res2.json();

    if (locs && locs.length > 0) {
      for (var i = 0; i < locs.length; i++) {
        addPoint(locs[i].lat, locs[i].lng, new Date(locs[i].recorded_at));
      }
    } else {
      addPoint(lat, lng, new Date(ev.triggered_at));
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('action-buttons').style.display = 'flex';

    if (!ev.is_active) {
      document.getElementById('status-text').textContent = 'Alert is no longer active';
      document.getElementById('header').style.background = '#64748b';
    } else {
      setInterval(poll, 5000);
      setInterval(updateTimer, 1000);
    }

  } catch (err) {
    document.getElementById('load-text').textContent = 'Error: ' + err.message;
  }
}

async function poll() {
  if (!eventId) return;
  try {
    var since = lastUpdate ? lastUpdate.toISOString() : '2000-01-01T00:00:00Z';
    var res = await fetch(SUPA + '/location_updates?sos_event_id=eq.' + eventId + '&recorded_at=gt.' + since + '&order=recorded_at.asc', { headers: HDRS });
    var locs = await res.json();
    if (locs) {
      for (var i = 0; i < locs.length; i++) {
        addPoint(locs[i].lat, locs[i].lng, new Date(locs[i].recorded_at));
      }
    }
  } catch (e) {}
}

function addPoint(lat, lng, time) {
  trail.push([lat, lng]);
  lastUpdate = time;
  currentLat = lat;
  currentLng = lng;
  if (marker) marker.setLatLng([lat, lng]);
  if (polyline) polyline.setLatLngs(trail);
  if (map) map.panTo([lat, lng]);
  updateTimer();
}

function updateTimer() {
  if (!lastUpdate) return;
  var s = Math.floor((Date.now() - lastUpdate.getTime()) / 1000);
  var t = s < 5 ? 'just now' : s < 60 ? s + 's ago' : Math.floor(s/60) + 'm ' + (s%60) + 's ago';
  document.getElementById('status-text').textContent = 'Last updated: ' + t;
}

function openInMaps() {
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    window.location.href = 'maps://maps.apple.com/?q=' + currentLat + ',' + currentLng;
  } else {
    window.location.href = 'https://www.google.com/maps/search/?api=1&query=' + currentLat + ',' + currentLng;
  }
}

function openUber() {
  // Try Uber app deep link first, fallback to web
  var uberApp = 'uber://?action=setPickup&dropoff[latitude]=' + currentLat + '&dropoff[longitude]=' + currentLng + '&dropoff[nickname]=Their%20Location';
  var uberWeb = 'https://m.uber.com/ul/?action=setPickup&dropoff[latitude]=' + currentLat + '&dropoff[longitude]=' + currentLng + '&dropoff[nickname]=Their%20Location';

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    // Try app, fallback to web after short delay
    window.location.href = uberApp;
    setTimeout(function() { window.location.href = uberWeb; }, 1500);
  } else {
    window.location.href = uberWeb;
  }
}

</script>
</body>
</html>
